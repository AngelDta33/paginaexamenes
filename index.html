<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de control CCUMA</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/page.css" />
  <link rel="stylesheet" href="css/programa.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <header class="barra-superior">
    <div class="titulo-y-modulos">
      <h1 id="titulo-app">📋 Panel de control CCUMA</h1>
      <nav id="selector-modulo" class="selector-modulo oculto">
        <button type="button" id="btn-modulo-examenes" class="btn-modulo">📝 Exámenes</button>
        <button type="button" id="btn-modulo-grupos" class="btn-modulo">🗓 Grupos</button>
        <button type="button" id="btn-modulo-programas" class="btn-modulo">📚 Programas</button>
      </nav>
    </div>
    <div id="info-sesion" class="info-sesion"></div>
  </header>

  <main>
    <section id="vista-login" class="vista"></section>
    <section id="vista-lista" class="vista oculto"></section>
    <section id="vista-editor" class="vista oculto"></section>
    <section id="vista-config" class="vista oculto"></section>
    <section id="vista-admin" class="vista oculto"></section>
    <section id="vista-grupos" class="vista oculto tema-verde"></section>
    <section id="vista-grupo" class="vista oculto tema-verde"></section>
    <section id="vista-programas" class="vista oculto tema-morado"></section>
    <section id="vista-programa" class="vista oculto tema-morado"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
